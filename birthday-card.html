<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ravi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1a;--card:#161a2e;--tx:#f4f1ff;--mut:#a9a6c4;--a:#b794f6;--b:#ff8fb1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf6ff;--card:#fff;--tx:#241a3a;--mut:#6d6585}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;overflow-x:hidden}
#cv{position:fixed;inset:0;pointer-events:none;z-index:50}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;bottom:-60px;animation:up linear infinite;opacity:.7}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--a);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(2.2)}}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .8s,visibility .8s;cursor:pointer}
#gate.o{opacity:0;visibility:hidden}
.env{font-size:80px;animation:fl 2.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(6deg)}}
.pulse{animation:pu 1.6s infinite}@keyframes pu{50%{opacity:.35}}
h1,.s{font-family:'Playfair Display',Georgia,serif;font-style:italic}
.g{background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.mut{color:var(--mut);font-weight:300}
main{position:relative;z-index:2;max-width:520px;margin:auto;padding:28px 20px 60px;text-align:center}
.hero .ph{overflow:hidden;border-radius:24px;box-shadow:0 20px 50px #b794f655;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 20px 70px #ff8fb166}}
.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translate(-2%,-2%)}}
h1{font-size:clamp(36px,11vw,54px);line-height:1.15;margin:22px 0 8px}
h1 span{display:inline-block;opacity:0;transform:translateY(30px) rotate(8deg);animation:pop .7s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.msg{background:var(--card);border-radius:20px;padding:24px 20px;margin:28px 0;line-height:1.8;font-weight:300;text-align:left;min-height:120px}
.msg b{font-weight:600}
.cur::after{content:'|';animation:pu .8s infinite;color:var(--b)}
.mq{overflow:hidden;margin:26px -20px;white-space:nowrap}
.mq div{display:inline-flex;gap:10px;animation:mq 28s linear infinite}
.mq img{height:120px;width:96px;object-fit:cover;border-radius:12px}
@keyframes mq{to{transform:translateX(-50%)}}
h2{font-size:26px;margin:34px 0 14px}
.wall{columns:2;column-gap:12px;text-align:left}
.pol{break-inside:avoid;background:#fff;padding:7px 7px 24px;border-radius:6px;margin-bottom:14px;box-shadow:0 8px 20px #0005;cursor:pointer;transition:transform .35s}
.pol img{width:100%;display:block;border-radius:3px}
.pol:hover,.pol:active{transform:scale(1.06) rotate(0)!important;z-index:3;position:relative}
.r{opacity:0;transform:translateY(40px) scale(.96);transition:1s cubic-bezier(.2,.8,.2,1)}.r.v{opacity:1;transform:none}
.pol.r{transform:translateY(50px) rotate(var(--t))}.pol.r.v{transform:rotate(var(--t))}
.cake{font-size:76px;cursor:pointer;user-select:none;margin:6px 0;position:relative;display:inline-block;animation:fl 2.5s ease-in-out infinite}
.cake.off{animation:bn .6s}@keyframes bn{50%{transform:scale(1.4) rotate(-10deg)}}
button{font:600 15px Poppins,sans-serif;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));border:0;border-radius:99px;padding:14px 30px;cursor:pointer;animation:bt 2s infinite}
@keyframes bt{50%{transform:scale(1.07)}}
#lb{position:fixed;inset:0;z-index:70;background:#000d;display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:88vh;border-radius:14px;animation:pop .4s forwards}
</style></head><body>
